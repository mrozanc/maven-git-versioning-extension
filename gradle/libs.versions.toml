[versions]
junit = "6.1.3"
jspecify = "1.0.0"
jgit = "7.8.0.202609011348-r"
jackson = "2.22.4"
decentxml = "1.4"
maven = "3.10.0"
mavenPluginAnnotations = "3.16.0"
assertj = "3.27.7"
mavenVerifier = "2.0.0"
slf4j = "2.0.20"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
decentxml = { module = "de.pdark:decentxml", version.ref = "decentxml" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-artifact = { module = "org.apache.maven:maven-artifact", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "mavenPluginAnnotations" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
maven-verifier = { module = "org.apache.maven.shared:maven-verifier", version.ref = "mavenVerifier" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
sisu-inject = { module = "org.eclipse.sisu:org.eclipse.sisu.inject", version = "0.9.0.M4" }
